<!DOCTYPE html>
<html xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">
<head><title>Gestione Torneo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <h2>Gestione Torneo</h2>
        <form th:action="@{/admin/torneo/salva}" th:object="${torneo}" method="post">
            <input type="hidden" th:field="*{id}" />
            <label>Nome Torneo:</label>
            <input type="text" th:field="*{nome}" required style="width: 100%; margin-bottom: 15px;"><br>
            
            <label>Anno:</label>
            <input type="number" th:field="*{anno}" required style="width: 100%; margin-bottom: 15px;"><br>
            
            <label>Descrizione:</label>
            <textarea th:field="*{descrizione}" style="width: 100%; margin-bottom: 15px;"></textarea><br>
            
            <button type="submit" class="btn btn-primary">Salva Torneo</button>
            <a th:href="@{/admin/dashboard}">Annulla</a>
        </form>
    </div>
</body>
</html>
