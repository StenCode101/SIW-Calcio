<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rosa Squadra - SIW Calcio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a th:href="@{/}">⚽ SIW Calcio</a></div>
        <ul class="nav-links">
            <li><a th:href="@{/squadre}">&larr; Torna alle Squadre</a></li>
        </ul>
    </nav>

    <main class="container">
        <h2>Rosa della squadra: <span th:text="${squadra.nome}">Nome Squadra</span></h2>
        
        <table style="width: 100%; text-align: left; margin-top: 20px; border-collapse: collapse;" border="1">
            <thead style="background-color: #f8f9fa;">
                <tr>
                    <th style="padding: 10px;">Nome</th>
                    <th style="padding: 10px;">Cognome</th>
                    <th style="padding: 10px;">Data di Nascita</th>
                    <th style="padding: 10px;">Altezza</th>
                    <th style="padding: 10px;">Ruolo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="giocatore : ${giocatori}">
                    <td style="padding: 10px;" th:text="${giocatore.nome}"></td>
                    <td style="padding: 10px;" th:text="${giocatore.cognome}"></td>
                    <td style="padding: 10px;" th:text="${giocatore.dataDiNascita}"></td>
                    <!-- Aggiungo dinamicamente la dicitura "cm" -->
                    <td style="padding: 10px;" th:text="${giocatore.altezza} + ' cm'"></td>
                    <td style="padding: 10px;" th:text="${giocatore.ruolo}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(giocatori)}">
                    <td colspan="5" style="text-align: center; padding: 15px;">Nessun giocatore registrato per questa squadra.</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
