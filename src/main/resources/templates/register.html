<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione - SIW Calcio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a th:href="@{/}">⚽ SIW Calcio</a></div>
    </nav>

    <main class="container" style="max-width: 400px; margin: auto;">
        <div class="card">
            <h2>Crea un Account</h2>
            <form th:action="@{/register}" th:object="${utente}" method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <div>
                    <label>Username</label><br>
                    <!-- th:field collaga questo input all'attributo "username" dell'entità Utente -->
                    <input type="text" th:field="*{username}" required style="width: 100%; padding: 8px;">
                </div>
                <div>
                    <label>Password</label><br>
                    <!-- th:field collaga questo input all'attributo "password" dell'entità Utente -->
                    <input type="password" th:field="*{password}" required style="width: 100%; padding: 8px;">
                </div>
                <button type="submit" class="btn btn-primary">Registrati</button>
            </form>
        </div>
    </main>
</body>
</html>
