spring.application.name=siw-calcio
# ===============================
# CONNESSIONE A SUPABASE (POSTGRESQL)
# ===============================

# URL di connessione JDBC (Sostituisci i placeholder con i tuoi dati reali)
# Puoi trovare l'URL esatto nella dashboard Supabase: Project Settings -> Database -> Connection string -> JDBC
spring.datasource.url=jdbc:postgresql://db.zfrpropiyaorbjglvagl.supabase.co:5432/postgres?sslmode=require

# L'username del database (di solito postgres oppure postgres.[id_progetto])
spring.datasource.username=postgres
# La password del tuo database Supabase
spring.datasource.password=StenSUPABASE45

# Specifica il driver di PostgreSQL (Opzionale, Spring di solito lo rileva automaticamente)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAZIONE HIBERNATE / JPA
# ===============================

# Mostra le query SQL nel terminale (utile per il debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gestione dello schema del database:
# 'update' aggiorna lo schema se l'entità cambia (consigliato per lo sviluppo)
# ATTENZIONE: Usa 'validate' o 'none' in produzione
spring.jpa.hibernate.ddl-auto=update

# Dialetto PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect